name: Auto-milestone
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - closed
      - ready_for_review

permissions:
  pull-requests: write

jobs:
  main:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Run auto-milestone
        uses: grafana/grafana-github-actions-go/auto-milestone@787c3c212b43ce951adcb68a816fd329c275a12d # main
        with:
          pr: ${{ github.event.pull_request.number }}
          token: ${{ secrets.GITHUB_TOKEN }}
